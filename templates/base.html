<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Stockroom{% endblock %} — Small Business Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">Stockroom</div>
      <div class="sidebar-tagline">Inventory &amp; Sales</div>
      <nav class="sidebar-nav">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('list_products') }}" class="{{ 'active' if request.endpoint in ['list_products','add_product','edit_product'] }}">Products</a>
        <a href="{{ url_for('record_sale') }}" class="{{ 'active' if request.endpoint == 'record_sale' }}">Record Sale</a>
        <a href="{{ url_for('list_sales') }}" class="{{ 'active' if request.endpoint == 'list_sales' }}">Sales History</a>
        <a href="{{ url_for('reports') }}" class="{{ 'active' if request.endpoint == 'reports' }}">Reports</a>
      </nav>
    </aside>

    <main class="main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
